name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python -c "
          import os, json
          creds = json.loads(os.environ['CLOUD_CREDENTIALS'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'AWS_ACCESS_KEY_ID={creds[\"aws_access_key_id\"]}\n')
              f.write(f'AWS_SECRET_ACCESS_KEY={creds[\"aws_secret_access_key\"]}\n')
              f.write('AWS_DEFAULT_REGION=ap-southeast-1\n')
          "

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          import boto3

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          s3 = boto3.client('s3')
          s3.upload_file("models/model.pkl", bucket_name, "models/latest/model.pkl")
          s3.upload_file("outputs/metrics.json", bucket_name, "models/latest/metrics.json")
          print(f"Uploaded model.pkl and metrics.json to s3://{bucket_name}/models/latest/")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.70).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Cloud Storage
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          python -c "
          import os, json
          creds = json.loads(os.environ['CLOUD_CREDENTIALS'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'AWS_ACCESS_KEY_ID={creds[\"aws_access_key_id\"]}\n')
              f.write(f'AWS_SECRET_ACCESS_KEY={creds[\"aws_secret_access_key\"]}\n')
              f.write('AWS_DEFAULT_REGION=ap-southeast-1\n')
          "

      - name: Install dependencies
        run: pip install boto3

      - name: Check eval gate and compare with previous version
        run: |
          python - <<'EOF'
          import os
          import json
          import boto3
          from botocore.exceptions import ClientError

          acc_new = float("${{ needs.train.outputs.accuracy }}")
          
          if acc_new < 0.70:
              raise SystemExit(f"FAILED: Current accuracy {acc_new:.4f} < 0.70. Huy deploy.")
          print(f"PASSED Basic quality gate: current accuracy {acc_new:.4f} >= 0.70.")

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          s3 = boto3.client('s3')
          
          try:
              s3.download_file(bucket_name, "models/latest/metrics.json", "previous_metrics.json")
              with open("previous_metrics.json") as f:
                  prev_data = json.load(f)
              acc_prev = float(prev_data["accuracy"])
              print(f"Previous deployed model accuracy: {acc_prev:.4f}")
              
              if acc_new < acc_prev:
                  raise SystemExit(f"FAILED: Current accuracy ({acc_new:.4f}) is lower than previous model ({acc_prev:.4f}). Huy deploy.")
              print(f"PASSED Comparison: Current accuracy ({acc_new:.4f}) >= Previous accuracy ({acc_prev:.4f}). Deploying...")
          except ClientError as e:
              if e.response['Error']['Code'] in ("404", "NoSuchKey"):
                  print("No previous deployed model found in S3. Proceeding with initial deployment...")
              else:
                  raise e
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
